[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hakimino"
version = "0.1.0"
description = "Local encrypted password vault for Computer Security Project 2"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=25.1,<26", "cryptography>=50.0.2,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hakimino = "hakimino.cli:main"

[project.gui-scripts]
hakimino-gui = "hakimino.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
